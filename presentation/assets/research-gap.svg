<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Broken bridge icon: two halves of a bridge with a gap in the middle -->
  <!-- Left pillar -->
  <rect x="4" y="16" width="6" height="24" rx="1" stroke="#C44D3F" stroke-width="1.5" fill="none"/>
  <!-- Right pillar -->
  <rect x="38" y="16" width="6" height="24" rx="1" stroke="#C44D3F" stroke-width="1.5" fill="none"/>
  <!-- Left bridge span -->
  <path d="M10,20 L18,20" stroke="#C44D3F" stroke-width="2"/>
  <!-- Right bridge span -->
  <path d="M30,20 L38,20" stroke="#C44D3F" stroke-width="2"/>
  <!-- Broken gap — jagged lines -->
  <path d="M18,18 L20,22 L22,17 L24,23" stroke="#C44D3F" stroke-width="1.5" opacity="0.6"/>
  <path d="M24,17 L26,23 L28,18 L30,22" stroke="#C44D3F" stroke-width="1.5" opacity="0.6"/>
  <!-- Falling debris -->
  <line x1="22" y1="26" x2="23" y2="30" stroke="#C44D3F" stroke-width="1" opacity="0.4"/>
  <line x1="26" y1="25" x2="25" y2="29" stroke="#C44D3F" stroke-width="1" opacity="0.4"/>
</svg>
