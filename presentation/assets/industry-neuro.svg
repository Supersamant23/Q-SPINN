<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Chip / processor with brain squiggle inside -->
  <!-- Chip body -->
  <rect x="12" y="12" width="24" height="24" rx="2" stroke="#3FA65E" stroke-width="1.5" fill="#EEFDF2"/>
  
  <!-- Chip pins — top -->
  <line x1="18" y1="8" x2="18" y2="12" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="24" y1="8" x2="24" y2="12" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="30" y1="8" x2="30" y2="12" stroke="#3FA65E" stroke-width="1.5"/>
  <!-- Chip pins — bottom -->
  <line x1="18" y1="36" x2="18" y2="40" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="24" y1="36" x2="24" y2="40" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="30" y1="36" x2="30" y2="40" stroke="#3FA65E" stroke-width="1.5"/>
  <!-- Chip pins — left -->
  <line x1="8" y1="18" x2="12" y2="18" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="8" y1="24" x2="12" y2="24" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="8" y1="30" x2="12" y2="30" stroke="#3FA65E" stroke-width="1.5"/>
  <!-- Chip pins — right -->
  <line x1="36" y1="18" x2="40" y2="18" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="36" y1="24" x2="40" y2="24" stroke="#3FA65E" stroke-width="1.5"/>
  <line x1="36" y1="30" x2="40" y2="30" stroke="#3FA65E" stroke-width="1.5"/>
  
  <!-- Brain squiggle inside -->
  <path d="M18,20 Q20,16 24,20 Q28,24 24,28 Q20,32 24,28 Q28,24 30,28"
        stroke="#3FA65E" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>
